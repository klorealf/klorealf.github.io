<!-- KLF monogram inside a hexagon: a nod to the benzene ring from chemistry -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Khadija L. Franklin logo">
  <!-- The hexagon shape: six points drawn around the center -->
  <polygon points="32,3 57,17.5 57,46.5 32,61 7,46.5 7,17.5"
           fill="#E9E4F7" stroke="#2A9D8F" stroke-width="3" stroke-linejoin="round"/>
  <!-- The initials, centered in the hexagon -->
  <text x="32" y="38.5" text-anchor="middle"
        font-family="'Bricolage Grotesque', 'Trebuchet MS', sans-serif"
        font-size="18" font-weight="700" fill="#1F2A44">KLF</text>
</svg>
